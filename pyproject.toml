[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homeplan"
version = "0.6.3"
description = "일별 현금 원장으로 검토하는 주택 매수계획"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "openpyxl>=3.1,<4",
    "typer>=0.15,<1",
    "rich>=13,<15",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
homeplan = "homeplan.cli:app"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11",
    "mypy>=1.15",
    "types-PyYAML",
    "types-openpyxl",
    "hypothesis>=6",
    "pre-commit>=4",
    "httpx>=0.27,<1",
    "playwright>=1.45,<2",
]

build = ["pyinstaller>=6,<7"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/homeplan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["local: 실제 가구 파일이 있어야 하는 로컬 대조"]

[tool.hatch.build.targets.wheel]
packages = ["src/homeplan"]

[tool.hatch.build.targets.wheel.force-include]
"data/rules" = "homeplan/bundled_rules"
"web" = "homeplan/web_assets"
"tests/fixtures/synthetic_household.json" = "homeplan/demo_household.json"
