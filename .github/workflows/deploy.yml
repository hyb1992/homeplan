name: Deploy web and Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/homeplan
      - run: uv run pytest -q
      - run: python tools/check_private_files.py $(git ls-files)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/web/test_form_inputs.mjs
      - run: uv run python -m playwright install --with-deps chromium
      - run: uv run python tools/check_web_upgrade.py
      - run: uv run python tools/build_pages.py
      - name: Browser calculation and persistence
        run: |
          SITE=$(python -c "import json; print(json.load(open('data/pages-build.local.json'))['directory'])")
          uv run python tools/check_pages.py "$SITE"
      - name: Pages output
        id: pages
        run: echo "directory=$(python -c "import json; print(json.load(open('data/pages-build.local.json'))['directory'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.pages.outputs.directory }}

  pages:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Use Actions deployment after initial local publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT repos/${{ github.repository }}/pages -f build_type=workflow
      - uses: actions/deploy-pages@v4
        id: deployment

  windows:
    needs: checks
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --dev --group build
      - run: uv run --group build pytest tests/unit/test_updates.py tests/unit/test_gui_launcher.py -q
      - run: uv run --group build python tools/build_friend_package.py
      - name: Validate compiled package
        shell: pwsh
        run: |
          $package = Get-Content data/friend-package.local.json | ConvertFrom-Json
          uv run --group build python tools/check_friend_package.py $package.archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $build = Get-Content data/release-build.local.json | ConvertFrom-Json
          $version = uv run --group build python -c "import homeplan; print(homeplan.__version__)"
          $tag = "v$version-build.${{ github.run_number }}.${{ github.run_attempt }}"
          gh release create $tag --target "$env:GITHUB_SHA" --title "HomePlan $version ($($env:GITHUB_SHA.Substring(0,7)))" --notes-file RELEASE_NOTES.md --latest "$($build.directory)/HomePlan-Windows-x64.zip" "$($build.directory)/release.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
